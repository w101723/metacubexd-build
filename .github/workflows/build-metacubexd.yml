name: Build MetaCubeXD Runtime

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "MetaCubeXD source repository"
        required: true
        default: "MetaCubeX/metacubexd"

      ref:
        description: "Branch / Tag / Commit SHA"
        required: true
        default: "main"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.34.1"


# ============================================================
# Build UI
# ============================================================
jobs:
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=5120"
      HUSKY: "0"

    steps:
      - name: Checkout MetaCubeXD source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: metacubexd
          fetch-depth: 1

      - name: Show source information
        working-directory: metacubexd
        run: |
          echo "========================================"
          echo "Repository : ${{ inputs.repository }}"
          echo "Ref        : ${{ inputs.ref }}"
          echo "========================================"

          git remote -v
          git log -1 --oneline

          echo
          echo "package.json:"
          cat package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: metacubexd/pnpm-lock.yaml

      - name: Show build environment
        run: |
          echo "Node:"
          node --version

          echo
          echo "pnpm:"
          pnpm --version

          echo
          echo "Memory:"
          free -h

          echo
          echo "CPU:"
          nproc

      - name: Install dependencies
        working-directory: metacubexd
        run: |
          pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: metacubexd
        run: |
          echo "Building MetaCubeXD UI..."
          pnpm build:ui

      - name: Verify UI output
        run: |
          echo "========================================"
          echo "UI build result"
          echo "========================================"

          ls -lah metacubexd/packages/ui/.output/
          ls -lah metacubexd/packages/ui/.output/public/

          test -f \
            metacubexd/packages/ui/.output/public/index.html

          echo
          echo "UI size:"
          du -sh metacubexd/packages/ui/.output/public

          echo
          echo "UI file count:"
          find metacubexd/packages/ui/.output/public \
            -type f | wc -l

      # 不直接 upload .output
      # 避免 hidden directory 被 upload-artifact 忽略
      - name: Prepare UI artifact
        run: |
          mkdir -p artifact/ui-dist

          cp -a \
            metacubexd/packages/ui/.output/public/. \
            artifact/ui-dist/

          echo "========================================"
          echo "Prepared UI artifact"
          echo "========================================"

          ls -lah artifact/ui-dist

          test -f artifact/ui-dist/index.html

          du -sh artifact/ui-dist

      - name: Upload UI artifact
        uses: actions/upload-artifact@v7
        with:
          name: metacubexd-ui
          path: artifact/ui-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 6


# ============================================================
# Build Server
# ============================================================
  build-server:
    name: Build Server
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      HUSKY: "0"

    steps:
      - name: Checkout MetaCubeXD source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: metacubexd
          fetch-depth: 1

      - name: Show source information
        working-directory: metacubexd
        run: |
          echo "========================================"
          echo "Repository : ${{ inputs.repository }}"
          echo "Ref        : ${{ inputs.ref }}"
          echo "========================================"

          git remote -v
          git log -1 --oneline

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: metacubexd/pnpm-lock.yaml

      - name: Show build environment
        run: |
          echo "Node:"
          node --version

          echo
          echo "pnpm:"
          pnpm --version

          echo
          echo "Memory:"
          free -h

          echo
          echo "CPU:"
          nproc

      - name: Install dependencies
        working-directory: metacubexd
        run: |
          pnpm install --frozen-lockfile

      - name: Build Server
        working-directory: metacubexd
        run: |
          echo "Building MetaCubeXD Server..."
          pnpm build:server

      - name: Verify Server output
        run: |
          echo "========================================"
          echo "Server build result"
          echo "========================================"

          ls -lah metacubexd/apps/server/

          if [ ! -d metacubexd/apps/server/.output ]; then
            echo "ERROR: apps/server/.output does not exist"
            exit 1
          fi

          ls -lah metacubexd/apps/server/.output/

          echo
          echo "Looking for index.mjs:"
          find metacubexd/apps/server/.output \
            -name 'index.mjs' \
            -type f \
            -print

          test -f \
            metacubexd/apps/server/.output/server/index.mjs

          echo
          echo "Server size:"
          du -sh metacubexd/apps/server/.output

          echo
          echo "Server file count:"
          find metacubexd/apps/server/.output \
            -type f | wc -l

      # 先把隐藏的 .output 内容复制到普通目录
      - name: Prepare Server artifact
        run: |
          mkdir -p artifact/server

          cp -a \
            metacubexd/apps/server/.output/. \
            artifact/server/

          echo "========================================"
          echo "Prepared Server artifact"
          echo "========================================"

          ls -lah artifact/server
          ls -lah artifact/server/server

          test -f \
            artifact/server/server/index.mjs

          du -sh artifact/server

      - name: Upload Server artifact
        uses: actions/upload-artifact@v7
        with:
          name: metacubexd-server
          path: artifact/server/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 6


# ============================================================
# Package
# ============================================================
  package:
    name: Package Runtime
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: metacubexd-latest-release
      cancel-in-progress: false

    needs:
      - build-ui
      - build-server

    steps:
      - name: Download UI artifact
        uses: actions/download-artifact@v7
        with:
          name: metacubexd-ui
          path: runtime/ui-dist

      - name: Download Server artifact
        uses: actions/download-artifact@v7
        with:
          name: metacubexd-server
          path: runtime/server

      - name: Verify complete runtime
        run: |
          echo "========================================"
          echo "Runtime directory"
          echo "========================================"

          find runtime \
            -maxdepth 3 \
            -type f \
            | head -100

          echo
          echo "Checking UI..."

          test -f \
            runtime/ui-dist/index.html

          echo "UI OK"

          echo
          echo "Checking Server..."

          test -f \
            runtime/server/server/index.mjs

          echo "Server OK"

          echo
          echo "Sizes:"

          du -sh runtime/ui-dist
          du -sh runtime/server
          du -sh runtime

      - name: Write build information
        run: |
          cat > runtime/BUILD_INFO <<EOF
          Repository=${{ inputs.repository }}
          Ref=${{ inputs.ref }}
          Node=${{ env.NODE_VERSION }}
          pnpm=${{ env.PNPM_VERSION }}
          BuildDate=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GitHubRun=${{ github.run_id }}
          EOF

          cat runtime/BUILD_INFO

      - name: Create runtime archive
        run: |
          echo "Creating tar.gz..."

          tar \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C runtime \
            -czf metacubexd-runtime.tar.gz \
            .

          sha256sum \
            metacubexd-runtime.tar.gz \
            > metacubexd-runtime.tar.gz.sha256

          echo
          echo "========================================"
          echo "Final files"
          echo "========================================"

          ls -lh \
            metacubexd-runtime.tar.gz \
            metacubexd-runtime.tar.gz.sha256

          echo
          echo "SHA256:"

          cat metacubexd-runtime.tar.gz.sha256

          echo
          echo "Archive contents:"

          tar tzf metacubexd-runtime.tar.gz \
            | head -100

      - name: Upload final runtime
        uses: actions/upload-artifact@v7
        with:
          name: metacubexd-runtime
          path: |
            metacubexd-runtime.tar.gz
            metacubexd-runtime.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          release_tag="latest"
          release_title="MetaCubeXD Runtime — latest"

          release_notes="$(printf '%s\n' \
            'Automated MetaCubeXD runtime build.' \
            '' \
            "Source repository: ${SOURCE_REPOSITORY}" \
            "Source ref: ${SOURCE_REF}" \
            "Workflow run: ${RUN_URL}")"

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release edit "${release_tag}" \
              --title "${release_title}" \
              --notes "${release_notes}"
          else
            gh release create "${release_tag}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes "${release_notes}"
          fi

          gh release upload "${release_tag}" \
            metacubexd-runtime.tar.gz \
            metacubexd-runtime.tar.gz.sha256 \
            --clobber

          release_url="$(gh release view "${release_tag}" --json url --jq '.url')"

          {
            echo "## Published Release"
            echo
            echo "- Release: [${release_tag}](${release_url})"
            echo "- Source repository: \`${SOURCE_REPOSITORY}\`"
            echo "- Source ref: \`${SOURCE_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
